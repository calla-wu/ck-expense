<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>CK Expense</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CK Expense">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  html, body { margin:0; height:100%; background:#0f1115; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbxTOk1AQxfl-DxuFTewjVv_LRR0NVOnCGQqKI8gA7K8pGb8qpLS5xZ7QG39JZIWsONf/exec" title="CK Expense"></iframe>
<script>
// 記帳網頁（Google Apps Script）以 postMessage 向本頁取得／保存 PIN；只接受 Google 網域來源，且只回覆給發問的框。
(function () {
  var K = 'ckpin', OK = /^https:\/\/([a-z0-9-]+\.)*(googleusercontent|google)\.com$/;
  addEventListener('message', function (e) {
    if (!OK.test(e.origin)) return;
    var d = e.data || {};
    try {
      if (d.ck === 'getpin') e.source.postMessage({ ck: 'pin', pin: localStorage.getItem(K) || '' }, e.origin);
      else if (d.ck === 'setpin' && typeof d.pin === 'string' && d.pin) localStorage.setItem(K, d.pin);
      else if (d.ck === 'clearpin') localStorage.removeItem(K);
    } catch (err) {}
  });
})();
</script>
</body>
</html>
